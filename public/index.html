<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="ImageShare - Upload and share images.">
    <link rel="stylesheet" href="/public/css/index.css">
    <title>ImageShare</title>
  </head>
  <body>
    <div class=content>
      <h1>ImageShare</h1>
      <h2 id=status-msg>Upload and share images with friends.</h2>
      <p>
        <input id=file class=hidden-file-input name=file multiple type=file accept="image/*,video/*">
        <label id=dropzone for=file class="input file-label">
          Select or Drop Files
        </label>
      </p>
      <p>
        <button id=submit class=input disabled>Upload</button>
      </p>
      <div id=uploads>
      </div>
    </div>
    <template id=upload-tmpl>
      <div class=upload-g>
        <div class="img center-me"></div>
        <div><a></a></div>
        <div><button class=cp>Copy link</button></div>
      </div>
    </template>
    <script defer src="/public/js/upload-handler.js"></script>
  </body>
</html>
